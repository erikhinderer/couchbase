# Pinning the project name keeps every `docker compose` invocation scoped to the
# same networks/volumes/containers regardless of what folder you extracted the
# project into or renamed it to (e.g. "couchbase-migration-agent" vs "Couchbase
# Migration Agent"). Without this, Compose derives the project name from the
# current directory name, so two differently-named copies of this project can
# each spin up their own network -- and if you also fix container names (see
# below), a container from one copy can collide with the other on `up`.
name: couchbase-migration-agent

services:
  # -- Agent memory: Couchbase Enterprise Edition with Vector Search --------
  # Runs Couchbase Enterprise Edition so native ANN vector search (FTS vector
  # index) is available for agent-memory semantic recall -- see
  # backend/app/memory/couchbase_memory.py.
  #
  # Licensing: the `couchbase:enterprise-*` image is free to download and run
  # for internal development/testing/evaluation (Couchbase's Enterprise Free
  # license). It automatically converts to a paid Enterprise subscription if
  # used in production or if you request Couchbase support -- see
  # https://www.couchbase.com/legal/agreements/ for the exact terms. If that doesn't fit
  # your use case, point MEMORY_CB_* at Couchbase Capella instead (also has
  # native vector search, fully managed, and the backend code doesn't care
  # which one it's talking to).
  couchbase-memory:
    image: couchbase:enterprise-7.6.2
    restart: unless-stopped
    ports:
      - "8091-8096:8091-8096"   # admin UI (8091) + FTS (8094) + N1QL (8093), etc.
      - "11210-11211:11210-11211"
    volumes:
      - couchbase_memory_data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 10s
      # Couchbase's Erlang VM + index/search engines can take a couple of
      # minutes to come up on a cold or resource-constrained boot (e.g. under
      # emulation on Apple Silicon, or competing with the Qwen model pull for
      # CPU on first run) -- generous retries avoid a false "unhealthy" that
      # blocks memory-init/backend from ever starting.
      retries: 30
      start_period: 30s
    networks: [cma-net]

  # One-shot bootstrap of the agent-memory bucket/scope/collection/indexes.
  # Retries itself (via `restart: on-failure`) rather than requiring a manual
  # re-run if it loses the race with Couchbase finishing its own startup --
  # and critically, nothing else in the stack hard-blocks on this succeeding
  # (see backend's depends_on below), so a slow or failed memory-init no
  # longer prevents the rest of the app from starting.
  memory-init:
    build:
      context: .
      dockerfile: scripts/Dockerfile.init
    depends_on:
      couchbase-memory:
        condition: service_healthy
    environment:
      MEMORY_CB_HOST: couchbase-memory
      MEMORY_CB_USERNAME: ${MEMORY_CB_USERNAME:-Administrator}
      MEMORY_CB_PASSWORD: ${MEMORY_CB_PASSWORD:-change-me-strong-password}
      MEMORY_CB_BUCKET: ${MEMORY_CB_BUCKET:-agent_memory}
      MEMORY_CB_SCOPE: ${MEMORY_CB_SCOPE:-agent}
      MEMORY_CB_COLLECTION: ${MEMORY_CB_COLLECTION:-episodes}
    networks: [cma-net]
    restart: on-failure:5

  # -- Local LLM: Qwen 3, served via Ollama-compatible API ------------------
  # Runs on CPU by default (works out of the box on macOS/Windows Docker Desktop,
  # which don't support GPU passthrough anyway). To use an NVIDIA GPU on Linux,
  # run with the optional override file:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
  qwen-service:
    build: ./qwen-service
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks: [cma-net]
    healthcheck:
      # The official ollama/ollama image doesn't ship curl, so probe with the
      # `ollama` CLI itself rather than an HTTP client.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # -- FastAPI backend / migration engine -----------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEMORY_CB_CONNECTION_STRING: couchbase://couchbase-memory
      QWEN_BASE_URL: http://qwen-service:11434
    volumes:
      - backup_data:/data/backups
      - state_data:/data/state
    ports:
      - "8000:8000"
    depends_on:
      # Only gated on the two services the backend talks to directly and
      # continuously. memory-init is deliberately NOT a hard dependency here:
      # it's a best-effort one-time setup step (bucket/scope/collection/index
      # creation) that the backend's own memory code already tolerates being
      # incomplete (AgentMemoryStore logs a warning and degrades gracefully
      # rather than crashing) -- so a slow or failed memory-init should never
      # be the reason the whole app fails to start.
      couchbase-memory:
        condition: service_healthy
      qwen-service:
        condition: service_healthy
    networks: [cma-net]

  # -- React dark-mode UI ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      # Vite bakes these into the static JS bundle at build time (see the ARG/ENV
      # comment in frontend/Dockerfile) -- a runtime `environment:` block here would
      # have no effect on an already-built app, so they're passed as build args
      # instead. Override via .env if you're accessing the UI from something other
      # than localhost (e.g. VITE_API_BASE_URL=http://<your-lan-ip>:8000) -- and if
      # you do, also add that same origin to the backend's CORS_ORIGINS so the
      # browser's requests aren't rejected by CORS.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks: [cma-net]

networks:
  cma-net:
    driver: bridge

volumes:
  couchbase_memory_data:
  ollama_data:
  backup_data:
  state_data:
